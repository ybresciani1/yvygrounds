<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Street Fluffers ★ YvyGrounds Arcade</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../arcade.css">
  <style>
    /* Touch controls over the canvas (only shown on touch screens, during a fight) */
    .pad { position: absolute; left: 0; right: 0; bottom: 1.5cqw; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 2cqw; pointer-events: none; }
    .pad[hidden] { display: none; }
    .pad-group { display: flex; gap: 1.4cqw; pointer-events: auto; }
    .pad-group.attacks { margin-right: 12cqw; } /* leave room for the mute button */
    .pad button {
      width: 9cqw; height: 9cqw; padding: 0;
      border: .5cqw solid #2b1a52; border-radius: 50%;
      background: rgba(255, 248, 228, .75); color: #2b1a52;
      font: 1.7cqw/1 "Press Start 2P", monospace;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      cursor: pointer;
    }
    .pad button.is-down { background: #ffd23f; transform: translateY(.4cqw); }
    .pad button.bap { background: rgba(255, 140, 198, .85); }
    .pad button.kick { background: rgba(124, 198, 255, .85); }
    .pad button.special { background: rgba(255, 210, 63, .9); font-size: 3.4cqw; }
  </style>
</head>
<body>
  <p class="arcade-back"><a href="../../#games">« Back to YvyGrounds</a></p>
  <h1 class="arcade-title">Street Fluffers</h1>

  <div class="stage">
    <canvas id="game" width="960" height="720" tabindex="0"
      aria-label="Street Fluffers. Peaches the Pomeranian takes on Bojjii or Lychee in a best of three backyard brawl. Bap, kick, block by holding back, and throw your special move."></canvas>
    <!-- Menus sit under the title panel / winner panel (positions match the canvas layout) -->
    <div class="arcade-menu" id="menu" style="top: 79%; bottom: auto;">
      <button type="button" data-opp="bojjii" aria-label="Fight Bojjii">🐕 vs Bojjii</button>
      <button type="button" data-opp="lychee" class="alt" aria-label="Fight Lychee">🐱 vs Lychee</button>
    </div>
    <div class="arcade-menu" id="overMenu" style="top: 79%; bottom: auto;" hidden>
      <button type="button" id="rematch">Rematch!</button>
      <button type="button" id="toMenu" class="alt">Menu</button>
    </div>
    <div class="pad" id="pad" hidden>
      <div class="pad-group">
        <button type="button" data-hold="left" aria-label="Walk left (hold back to block)">◀</button>
        <button type="button" data-hold="up" aria-label="Jump">▲</button>
        <button type="button" data-hold="right" aria-label="Walk right (hold back to block)">▶</button>
      </div>
      <div class="pad-group attacks">
        <button type="button" data-press="bap" class="bap" aria-label="Bap">BAP</button>
        <button type="button" data-press="kick" class="kick" aria-label="Kick">KICK</button>
        <button type="button" data-press="special" class="special" aria-label="Special move">✨</button>
      </div>
    </div>
    <button class="mute" id="mute" type="button" aria-pressed="false" aria-label="Mute sound">🔊</button>
  </div>

  <p class="arcade-help">Peaches vs. Bojjii or Lychee, best of 3! <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> walk, <kbd>↑</kbd> or <kbd>W</kbd> jumps. <kbd>J</kbd> baps, <kbd>K</kbd> kicks, <kbd>L</kbd> throws a Fluff Ball (or go <kbd>↓</kbd> <kbd>→</kbd> + <kbd>J</kbd>, like the old days). Hold away from your opponent to block. On a phone, use the buttons on screen. <kbd>P</kbd> pauses, <kbd>M</kbd> mutes.</p>

  <script src="game.js"></script>
</body>
</html>
